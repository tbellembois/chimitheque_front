[package]
name = "chimitheque_front"
version = "0.1.0"
edition = "2024"
authors = ["Thomas Bellembois <thomas.bellembois@proton.me>"]
description = "Frontend for Chimithèque"
license = "GPL-3.0"
repository = "https://github.com/tbellembois/chimitheque_front"
homepage = "https://github.com/tbellembois/chimitheque_front"
readme = "README.md"
categories = ["database", "science"]
keywords = ["chemistry", "biology", "database", "management"]
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = { version = "0.35.0", default-features = false }
egui = { version = "0.35.0", default-features = false }
egui_extras = { version = "0.35.0", default-features = false, features = ["svg"]}

#egui-phosphor =  { version = "0.12", features = ["regular", "fill"]}
egui-phosphor = { git = "https://github.com/crumblingstatue/egui-phosphor", rev = "5a0075f68a463f6b316d39776fff519a2762b729", default-features = false, features = ["regular", "fill"] }

ehttp = { version = "0.7.1", default-features = false }
log = { version = "0.4.29", default-features = false }
rust-i18n = { version = "3", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false }
wasm-rs-shared-channel = { version = "0.1.0" }

# thbellem
chimitheque_utils = { path = "/home/thbellem/workspace/workspace_rust/chimitheque_utils" }
chimitheque_types = { path = "/home/thbellem/workspace/workspace_rust/chimitheque_types" }
egui_select2 = { path = "/home/thbellem/workspace/workspace_rust/egui_select2" }

web-sys = { version = "0.3.94", features = ["Document", "Window", "Element", "HtmlInputElement","HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",]}
wasm-bindgen = "0.2.117"
js-sys = "0.3.94"
image  = { version = "0.25" }
usvg = "0.47.0"
resvg = "0.47.0"
base64 = "0.22.1"
hex = "0.4.3"
once_cell = "1.21.4"
egui-typed-input = "0.1.3"

# chimitheque_types = { git = "https://github.com/tbellembois/chimitheque_types.git", branch = "main" }

# [patch."https://github.com/tbellembois/chimitheque_types.git"]
# chimitheque_types = { path = "../chimitheque_types" }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
debug = false
